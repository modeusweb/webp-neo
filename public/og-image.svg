<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a1e"/>
      <stop offset="50%" stop-color="#1a1035"/>
      <stop offset="100%" stop-color="#0f0a1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="180" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="1000" cy="480" r="250" fill="#d946ef" opacity="0.06"/>
  <circle cx="600" cy="315" r="300" fill="#7c3aed" opacity="0.04"/>

  <!-- Grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Logo box -->
  <rect x="60" y="40" width="90" height="90" rx="20" fill="url(#accent)" filter="url(#glow)"/>
  <text x="105" y="105" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="white" text-anchor="middle">W</text>

  <!-- Main content -->
  <g transform="translate(60, 200)">
    <!-- Headline -->
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="72" font-weight="800" fill="white">
      WebP Neo
    </text>

    <!-- Tagline -->
    <text x="0" y="130" font-family="Arial, sans-serif" font-size="36" fill="url(#text-gradient)">
      Free Image to WebP Converter
    </text>

    <!-- Description -->
    <text x="0" y="200" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8">
      Convert PNG, JPG, GIF, AVIF &amp; TIFF to WebP
    </text>
    <text x="0" y="235" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8">
      100% Private &amp; Secure — Nothing leaves your browser
    </text>

    <!-- Feature badges -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="140" height="44" rx="22" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
      <text x="70" y="28" font-family="Arial, sans-serif" font-size="16" fill="#c4b5fd" text-anchor="middle">100% Free</text>

      <rect x="160" y="0" width="170" height="44" rx="22" fill="#d946ef" opacity="0.2" stroke="#d946ef" stroke-width="1"/>
      <text x="245" y="28" font-family="Arial, sans-serif" font-size="16" fill="#f0abfc" text-anchor="middle">No Upload</text>

      <rect x="350" y="0" width="160" height="44" rx="22" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="1"/>
      <text x="430" y="28" font-family="Arial, sans-serif" font-size="16" fill="#67e8f9" text-anchor="middle">Batch Convert</text>
    </g>
  </g>

  <!-- URL at bottom -->
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="18" fill="#64748b">
    webp-neo.vercel.app
  </text>
</svg>